# LIVE. The shape `.github/workflows/ci.yml` has: a real trigger, gate 7's
# command as a step of a named job, that job in the aggregate's `needs:`, and
# nothing making either conditional. prove.sh must classify this one `live`,
# and a run in which it does not is a run whose liveness check answers `dead`
# to everything and therefore proves nothing about the others.
#
# It also serves the self-identification table, where the answer it is owed is
# `missing`: nothing here runs `fixtures/planted/gate-7/prove.sh`.
name: sample-live
on:
  pull_request:
jobs:
  gate-7:
    runs-on: ubuntu-latest
    steps:
      - name: cargo audit --deny warnings
        run: cargo audit --deny warnings
  ci:
    needs: [gate-7]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: aggregate
        run: echo aggregate
