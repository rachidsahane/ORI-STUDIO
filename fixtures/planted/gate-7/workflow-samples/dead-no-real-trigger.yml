# DEAD: the only trigger is `workflow_dispatch`, so nothing fires on a pull
# request and the job never runs. AICD §39 names this one: "Two CI workflows
# sat intact behind a manual trigger ... while every document cited them as
# gates."
name: sample-dead-no-real-trigger
on:
  workflow_dispatch:
jobs:
  gate-7:
    runs-on: ubuntu-latest
    steps:
      - name: cargo audit --deny warnings
        run: cargo audit --deny warnings
  ci:
    needs: [gate-7]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: aggregate
        run: echo aggregate
