#
# WHY A LOCKFILE AND NOTHING ELSE. cargo-audit reads Cargo.lock and compares
# the (name, version) pairs in it against the RustSec advisory database. It
# does not build, does not download the crates and does not need a Cargo.toml.
# So this directory is a lockfile with no manifest and no source: nothing can
# build it, nothing resolves it, and `cargo build --workspace` at the
# repository root never sees it. That is what lets gate 7's advisory half be
# proven on a real published advisory without adding a dependency to this
# repository, which spec/CONVENTIONS.md makes an escalation trigger.
#
# This file names one real crate at a version with no advisory against it.
# `cfg-if` was chosen because it is tiny, has no dependencies of its own and
# has never carried an advisory. It is still a bet on the future: if RustSec
# ever publishes one against 1.0.0, this input stops being clean and gate 7's
# prover reports a disagreement on this row. The repair is one line here, and
# the prover's message says so.
#
# This file is automatically @generated by Cargo.
# It is not intended for manual editing.
