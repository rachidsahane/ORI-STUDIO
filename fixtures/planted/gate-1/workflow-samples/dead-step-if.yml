# DEAD: the same, one level down. The job runs and reports success; the step
# carrying the gate command is skipped.
name: sample-dead-step-if
on:
  pull_request:
jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - name: cargo fmt --all --check
        if: false
        run: cargo fmt --all --check
  ci:
    needs: [fmt]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: aggregate
        run: echo aggregate
