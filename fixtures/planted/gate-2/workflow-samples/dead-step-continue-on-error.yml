# DEAD: the same on the step. The step's outcome is failure, its conclusion is
# success, the job succeeds.
name: sample-dead-step-continue-on-error
on:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: cargo test --workspace --locked
        continue-on-error: true
        run: cargo test --workspace --locked
  ci:
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: aggregate
        run: echo aggregate
