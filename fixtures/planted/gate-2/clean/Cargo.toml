# clean: the control input for the gate 2 proof of ORI-T-0014.
# 
# Spec: spec/TESTING.md section 4, spec/CI_CD.md section 1 gate 2,
# spec/runbooks/prove-gate.md step 2. Proof: ops/gates/gate-2.md. Rule: AICD
# section 14.
# 
# This package carries a correct implementation and tests that assert real
# things about it at all three levels `cargo test` runs: a unit test beside the
# code, an integration test under tests/, and a documentation test. Gate 2 owes
# it a pass, and the proof needs that pass: a harness that reports failure on
# every input has proven nothing.
#
# THE EMPTY [workspace] TABLE BELOW IS LOAD BEARING. It makes this directory
# its own workspace root, so the repository workspace at the root of the
# checkout, whose root Cargo.toml lists its members explicitly and uses no
# globs, never reaches this package. That is what lets a deliberately broken
# package sit in this tree while `cargo build --workspace`, `cargo test
# --workspace`, `cargo fmt --all` and `cargo clippy --workspace` at the
# repository root all stay green.
#
# No dependencies, deliberately: CLAUDE.md rule 6 forbids adding a crate, and a
# package with no dependencies also needs no network, so this proof runs on an
# offline runner.
[package]
name = "gate-2-clean"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"

[workspace]
