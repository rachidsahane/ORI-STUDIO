# no-tests: a package with no test of any kind (ORI-T-0014).
# 
# Spec: spec/CI_CD.md section 1 gate 2. Proof: ops/gates/gate-2.md. Rule: AICD
# section 14, and AICD section 39 "present but reporting nothing".
# 
# THIS PACKAGE IS NOT A DEFECT GATE 2 CATCHES. It is a defect gate 2 REPORTS AS
# SUCCESS, and it is here to make that observable rather than arguable. The
# library returns the wrong answer, exactly as failing-unit does. Nothing tests
# it: no unit test, no tests/ directory, no doc example. `cargo test --workspace
# --locked` prints "running 0 tests", prints "test result: ok", and exits 0.
# 
# The verdict gate 2 owes this input is therefore PASS, and the case table in
# prove.sh records it as a pass. That is not the harness being lenient: it is
# the harness recording what the gate does, so that ops/gates/gate-2.md can say
# what a green gate 2 establishes without guessing.
#
# THE EMPTY [workspace] TABLE BELOW IS LOAD BEARING. It makes this directory
# its own workspace root, so the repository workspace at the root of the
# checkout, whose root Cargo.toml lists its members explicitly and uses no
# globs, never reaches this package. That is what lets a deliberately broken
# package sit in this tree while `cargo build --workspace`, `cargo test
# --workspace`, `cargo fmt --all` and `cargo clippy --workspace` at the
# repository root all stay green.
#
# No dependencies, deliberately: CLAUDE.md rule 6 forbids adding a crate, and a
# package with no dependencies also needs no network, so this proof runs on an
# offline runner.
[package]
name = "gate-2-no-tests"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"

[workspace]
