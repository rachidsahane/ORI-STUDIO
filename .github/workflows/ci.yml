# ci.yml: the pull request pipeline for Ori Studio.
#
# Ticket: ORI-T-0012.  Spec: spec/CI_CD.md#1 ("Pipeline on every pull request").
# Tier 2 by spec/RISK_MAP.md, row `.github/workflows, scripts/release*`, reason
# "Supply chain".
#
# ===========================================================================
# THE TRIGGER THAT FIRES THIS WORKFLOW, NAMED
# ===========================================================================
#
# spec/PRD.md Z-02 requires that every artifact citing a gate names the trigger
# that fires it. AICD §39 records why: "Two CI workflows sat intact behind a
# manual trigger and a build target had no recipe, while every document cited
# them as gates", and the rule that lesson earned is that "present but
# reporting nothing" is a named defect class.
#
# FIRES ON, and these are the only four:
#
#   pull_request     every pull request into any branch, default activity
#                    types `opened`, `synchronize` and `reopened`. This is the
#                    trigger spec/CI_CD.md section 1 names. There is no
#                    `branches:` filter, because the specification says every
#                    pull request and not every pull request into main.
#   push (main only) the merge commit itself. Without it, `main` carries no
#                    green run of its own and the batch 1 exit criterion
#                    ("cargo build --workspace green on all three platforms in
#                    CI") would have no record on the branch it is about.
#   merge_group      spec/CI_CD.md section 2: "Only the merge queue merges. It
#                    rebases, re-runs gates 1 to 10, plus 13 and 14, on the
#                    rebased head". GitHub's merge queue raises `merge_group`
#                    and nothing else. A required check that does not fire on
#                    `merge_group` leaves the queue waiting forever on a status
#                    that can never arrive.
#   workflow_dispatch  additive only, never the sole trigger. It exists so the
#                    lead can fire a run by hand while verifying this file.
#                    Removing it would change nothing about what runs on a
#                    pull request. This is the trigger AICD §39 warns about;
#                    it is safe here only because the three real events above
#                    are present, and it must stay that way.
#
# DOES NOT FIRE ON, stated so that nobody infers coverage this file does not
# have:
#
#   - pushes to any branch other than `main` (a branch with no pull request is
#     not checked by anything; that is deliberate, the pull request is the unit)
#   - tag pushes `v*`. The release pipeline is spec/CI_CD.md section 4 and is
#     not ticketed in batch 1. Nothing here builds, signs or publishes.
#   - `schedule`. The liveness gate that spec/CI_CD.md section 1 describes
#     ("the liveness gate (scheduled) fails loudly if any required workflow has
#     not executed inside its window") is ORI-T-0046,
#     `crates/ori-gates/src/liveness.rs`, spec/PRD.md O-06. Putting a cron on
#     this workflow would make it run on a timer; it would not make it a
#     liveness check, and it would let a reader believe liveness is covered.
#   - `pull_request_target`. Deliberately absent: it runs the base branch's
#     workflow with write scope against a fork's code.
#   - draft pull requests are covered. `opened` fires when a pull request is
#     created as a draft and `synchronize` fires on every later push to it.
#     `ready_for_review` is not in the default type set and is not needed,
#     because a run has already happened by then.
#
# ===========================================================================
# WHAT THIS FILE INSTALLS, AND WHAT IT DOES NOT
# ===========================================================================
#
# AICD §14, under "The verification cycle", states the rule: "a gate is
# installed only when it has been seen to fail", and "Every gate (a CI check, a
# coverage matrix checker, a mutation threshold, a liveness check, a permission
# rule) enters service only after a demonstration on a planted defect: it
# passes on a clean tree, it fails on the planted defect, and the failure is
# visible where a human would look." AICD §39 restates it as "A gate is
# installed only after it has been seen to fail on a planted defect (section
# 14)". spec/DATA_MODEL.md gives the state machine
# `Defined -> Proven (GateProof present) -> Installed`.
#
# GATE 1 IS INSTALLED. `ops/gates/gate-1.md` records all three clauses met, the
# third on observed runs: run 35598542173, twelve green jobs on a pull request,
# and run 35598700908, on a branch carrying a deliberate formatting violation,
# where `fmt` and `ci` both report failure on the pull request. It may be cited
# as protection.
#
# GATE 2 IS PROVEN AND NOT YET INSTALLED, as of ORI-T-0014. The demonstration
# is `fixtures/planted/gate-2/` and the `gate-2-proof` job below; the record is
# `ops/gates/gate-2.md`. What is not yet observed is the third clause for this
# job specifically: the first run of `gate-2-proof` on a pull request, and a
# run in which a failing test in this repository's own workspace colours the
# `test` job red where a human looks. Both are the lead's to observe and
# record, neither is a coder's to assert, and until they are recorded the
# honest word for gate 2 is "proven".
#
# EVERY OTHER GATE NAMED IN spec/CI_CD.md SECTION 1 IS DEFINED AND NOTHING
# MORE. No document may cite one as protection.
#
# `ci` IS STILL NOT A REQUIRED STATUS CHECK on `main`.
# `ops/gates/branch-protection.md` records that there are none at all, that
# this is deliberate, and that "each check name is added on the day its proof
# file lands, starting with ORI-T-0013". Two proof files have now landed. Until
# `ci` is required, a red run here colours the pull request and blocks no
# merge, and that is the operator's action to take, not this file's.
#
#   job `fmt`          `cargo fmt --all --check`            gate 1, first half
#   job `clippy`       `cargo clippy ... -D warnings`       gate 1, second half
#   job `gate-1-proof` the demonstration that installed gate 1, repeated on
#                      every run rather than recorded once: it runs the same two
#                      commands against the defects planted for them under
#                      `fixtures/planted/gate-1/`, checks that each failure is
#                      the planted one, checks that this file still runs those
#                      commands somewhere a failure would fail this run, checks
#                      that this job is itself one whose failure fails this run,
#                      and fails this run if any of that stops being true.
#                      ORI-T-0013; the record is `ops/gates/gate-1.md`.
#   job `test`         `cargo test --workspace --locked`    gate 2
#   job `gate-2-proof` the demonstration that makes gate 2 proven, on the same
#                      terms. ORI-T-0014; `fixtures/planted/gate-2/`, and the
#                      record is `ops/gates/gate-2.md`. It differs from
#                      `gate-1-proof` in one way that matters to a reader of
#                      this file: gate 1 checks a property of the code, and
#                      gate 2 checks a property of the TESTS, which `cargo
#                      test` reports as satisfied in three states where it is
#                      not. `cargo test` exits 0 on a package with no tests, on
#                      tests that assert nothing, and when every test carries
#                      `#[ignore]`; and `--workspace` is only as wide as the
#                      root manifest's hand-written `members` list. Four of the
#                      eight planted inputs are there to record that, and they
#                      are inputs `gate-2-proof` expects the gate to PASS.
#                      A green `test` job therefore establishes that the tests
#                      which exist, run and assert did not fail, and nothing
#                      about whether any exist. `ops/gates/gate-2.md` says so
#                      at length; gates 4 and 6 of spec/CI_CD.md section 1, the
#                      coverage matrix and the mutation threshold, are what
#                      would make it mean more, and neither exists yet.
#   job `build`        the three-platform build             gate 11
#                      `spec/CI_CD.md` section 1 gate 11 allows
#                      "cross-compilation or matrix"; this is the matrix, built
#                      natively on each runner.
#
# Gates 3, 7 and 13 arrive with ORI-T-0015, ORI-T-0016 and ORI-T-0017; gates 9
# and 14 with ORI-T-0047 and ORI-T-0048. They all edit this file and they run
# serially for that reason (ops/phase-1-backlog.md, batch 1 order, and the lock
# table row for this path). Adding one is meant to be two edits: a new job, and
# its name added to `ci`'s `needs:`. The `ci` job at the bottom fails loudly if
# only the first of the two is done.
#
# ===========================================================================
# WHY EVERY COMPILING JOB ASSERTS THE TOOLCHAIN PIN FIRST
# ===========================================================================
#
# `rust-toolchain.toml` pins 1.98.1 with the rustfmt and clippy components. The
# GitHub runners ship rustup, and rustup's proxies install and select the pinned
# toolchain on the first `rustc` call, so this workflow installs no toolchain of
# its own and needs no toolchain action. That is a claim about somebody else's
# runner image, and an unchecked claim about a toolchain is how a build goes
# green on the wrong compiler while every document says it is pinned. So each
# compiling job checks it, on its own runner, before anything is built:
#
#   - the channel must be an exact x.y.z. A channel pin such as `stable` makes
#     the clippy lint set, and therefore the verdict of gate 1, an untracked
#     input; `rust-toolchain.toml` argues that case at length and this check
#     enforces what it decided.
#   - `rustc --version` must equal the pin. If it does not, this runner is not
#     honouring the pin and no result it produces means what it appears to mean.
#   - `cargo fmt --version` and `cargo clippy --version` must both work. A
#     missing component makes gate 1 unrunnable, and a job that cannot run a
#     check has to fail rather than pass quietly.
#
# The assert is byte for byte the same in all six jobs that compile anything.
# GitHub Actions has no YAML anchors and no way to share a step body, and a
# composite action would live at `.github/actions/`, outside the declared scope
# of the tickets that have edited this file. If you edit one copy, edit all
# six. `gate-1-proof` carries it for the same reason as the others and one
# more: a clippy verdict is a function of the lint set the toolchain ships, so
# a proof that gate 1 catches a lint is a claim about a specific toolchain.
# `gate-2-proof` carries it because the text a test failure prints, which its
# harness matches signatures against, is produced by the toolchain's own test
# harness and changes with it.
#
# ===========================================================================
# WHY EVERY ACTION IS PINNED TO A COMMIT SHA
# ===========================================================================
#
# This path is tier 2 for supply chain. A tag is a mutable pointer: whoever can
# move `v7` can run their code with this repository checked out. The SHA below
# was resolved against the GitHub API on 2026-09-21 and the tag it belonged to
# is recorded in the trailing comment so a human can audit the pin.

name: ci

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

# Least privilege, set once at the top so no job can quietly inherit more. No
# job here writes anything to the repository, the packages registry or the
# checks API.
permissions:
  contents: read

concurrency:
  # Supersede an in-flight run of the same pull request, and never supersede a
  # run on `main` or in the merge queue: cancelling a merge queue run drops the
  # queue's status and wedges it.
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    # One shell on all three runners. The Windows runner defaults to pwsh, and
    # a step whose body is interpreted by a different shell on one platform is
    # a step whose exit status means something different there.
    shell: bash

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    # The batch 1 exit criterion: `cargo build --workspace` green on all three
    # platforms in CI. Natively on each runner, not cross-compiled.
    name: build (${{ matrix.os }})
    strategy:
      # Report all three. With fail-fast on, one platform's failure cancels the
      # other two and the run says nothing about them.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Assert the pinned toolchain is the one in use
        run: |
          set -euo pipefail
          pin="$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml)"
          pin="${pin%%$'\n'*}"
          if [ -z "$pin" ]; then
            echo "::error file=rust-toolchain.toml::no [toolchain] channel line found, so the pin cannot be checked at all"
            exit 1
          fi
          if [[ ! "$pin" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=rust-toolchain.toml::the pin is '$pin', which is not an exact x.y.z version. rust-toolchain.toml states why the pin is exact: under a channel pin an upstream release changes the clippy lint set, and the verdict of gate 1 changes with no commit in this repository. Restore the exact pin, or change this check deliberately in a ticket."
            exit 1
          fi
          banner="$(rustc --version)"
          active="$(awk '{print $2}' <<<"$banner")"
          echo "rust-toolchain.toml pins : $pin"
          echo "rustc on PATH reports    : $active   ($banner)"
          if [ "$pin" != "$active" ]; then
            echo "::error file=rust-toolchain.toml::rustc is $active but rust-toolchain.toml pins $pin. This runner is not honouring the pin, and a green result here would be a green result on a toolchain nothing in this repository names."
            exit 1
          fi
          for probe in fmt clippy; do
            if ! cargo "$probe" --version; then
              echo "::error file=rust-toolchain.toml::'cargo $probe --version' failed, so the '$probe' component listed in rust-toolchain.toml is not usable on this runner"
              exit 1
            fi
          done
      - name: cargo build --workspace --locked
        # `--locked` so a resolver that wants to rewrite Cargo.lock fails here
        # instead of silently building against versions no commit records. On a
        # supply-chain-tiered path that is the whole point of having a lock file.
        run: cargo build --workspace --locked

  fmt:
    # spec/CI_CD.md section 1, gate 1, first half. Installed: the
    # `gate-1-proof` job below presents this command with the unformatted line
    # planted in `fixtures/planted/gate-1/fmt-defect`, which it must reject,
    # and with a clean package, which it must accept, and it refuses to report
    # a pass if this job stops being one whose failure fails this run. The
    # third clause of AICD §14, the failure being visible where a human would
    # look, was established by the observed runs recorded in
    # ops/gates/gate-1.md. ORI-T-0013.
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Assert the pinned toolchain is the one in use
        run: |
          set -euo pipefail
          pin="$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml)"
          pin="${pin%%$'\n'*}"
          if [ -z "$pin" ]; then
            echo "::error file=rust-toolchain.toml::no [toolchain] channel line found, so the pin cannot be checked at all"
            exit 1
          fi
          if [[ ! "$pin" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=rust-toolchain.toml::the pin is '$pin', which is not an exact x.y.z version. rust-toolchain.toml states why the pin is exact: under a channel pin an upstream release changes the clippy lint set, and the verdict of gate 1 changes with no commit in this repository. Restore the exact pin, or change this check deliberately in a ticket."
            exit 1
          fi
          banner="$(rustc --version)"
          active="$(awk '{print $2}' <<<"$banner")"
          echo "rust-toolchain.toml pins : $pin"
          echo "rustc on PATH reports    : $active   ($banner)"
          if [ "$pin" != "$active" ]; then
            echo "::error file=rust-toolchain.toml::rustc is $active but rust-toolchain.toml pins $pin. This runner is not honouring the pin, and a green result here would be a green result on a toolchain nothing in this repository names."
            exit 1
          fi
          for probe in fmt clippy; do
            if ! cargo "$probe" --version; then
              echo "::error file=rust-toolchain.toml::'cargo $probe --version' failed, so the '$probe' component listed in rust-toolchain.toml is not usable on this runner"
              exit 1
            fi
          done
      - name: cargo fmt --all --check
        # One runner is enough and three would not be more true: rustfmt's
        # verdict is a function of the source and rustfmt.toml, not of the host.
        run: cargo fmt --all --check

  clippy:
    # spec/CI_CD.md section 1, gate 1, second half. Installed: the
    # `gate-1-proof` job below presents this command with the
    # `clippy::len_zero` violation planted in
    # `fixtures/planted/gate-1/clippy-defect`, which it must reject, and with a
    # clean package, which it must accept, and it checks that the rejection
    # names that lint rather than being any failure at all. The third clause of
    # AICD §14 was established by the observed runs recorded in
    # ops/gates/gate-1.md. ORI-T-0013.
    name: clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # All three, unlike fmt. Lints fire on the code the target actually
        # compiles, so a `cfg(target_os)` branch that only Windows compiles is
        # only ever linted on Windows. This workspace will have such branches;
        # `ori-runtime` and `ori-broker` cannot avoid them.
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Assert the pinned toolchain is the one in use
        run: |
          set -euo pipefail
          pin="$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml)"
          pin="${pin%%$'\n'*}"
          if [ -z "$pin" ]; then
            echo "::error file=rust-toolchain.toml::no [toolchain] channel line found, so the pin cannot be checked at all"
            exit 1
          fi
          if [[ ! "$pin" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=rust-toolchain.toml::the pin is '$pin', which is not an exact x.y.z version. rust-toolchain.toml states why the pin is exact: under a channel pin an upstream release changes the clippy lint set, and the verdict of gate 1 changes with no commit in this repository. Restore the exact pin, or change this check deliberately in a ticket."
            exit 1
          fi
          banner="$(rustc --version)"
          active="$(awk '{print $2}' <<<"$banner")"
          echo "rust-toolchain.toml pins : $pin"
          echo "rustc on PATH reports    : $active   ($banner)"
          if [ "$pin" != "$active" ]; then
            echo "::error file=rust-toolchain.toml::rustc is $active but rust-toolchain.toml pins $pin. This runner is not honouring the pin, and a green result here would be a green result on a toolchain nothing in this repository names."
            exit 1
          fi
          for probe in fmt clippy; do
            if ! cargo "$probe" --version; then
              echo "::error file=rust-toolchain.toml::'cargo $probe --version' failed, so the '$probe' component listed in rust-toolchain.toml is not usable on this runner"
              exit 1
            fi
          done
      - name: cargo clippy --workspace --all-targets --locked -- -D warnings
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    # spec/CI_CD.md section 1, gate 2, workspace-wide. Proven and not yet
    # installed: the `gate-2-proof` job below presents this command with the
    # inputs planted under `fixtures/planted/gate-2/`, three of which carry a
    # failing test it must catch and four of which it passes while reporting
    # nothing. What is missing for installation is an observed run, which is
    # the lead's to make; see the top of this file. ORI-T-0014; the record is
    # ops/gates/gate-2.md.
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Assert the pinned toolchain is the one in use
        run: |
          set -euo pipefail
          pin="$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml)"
          pin="${pin%%$'\n'*}"
          if [ -z "$pin" ]; then
            echo "::error file=rust-toolchain.toml::no [toolchain] channel line found, so the pin cannot be checked at all"
            exit 1
          fi
          if [[ ! "$pin" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=rust-toolchain.toml::the pin is '$pin', which is not an exact x.y.z version. rust-toolchain.toml states why the pin is exact: under a channel pin an upstream release changes the clippy lint set, and the verdict of gate 1 changes with no commit in this repository. Restore the exact pin, or change this check deliberately in a ticket."
            exit 1
          fi
          banner="$(rustc --version)"
          active="$(awk '{print $2}' <<<"$banner")"
          echo "rust-toolchain.toml pins : $pin"
          echo "rustc on PATH reports    : $active   ($banner)"
          if [ "$pin" != "$active" ]; then
            echo "::error file=rust-toolchain.toml::rustc is $active but rust-toolchain.toml pins $pin. This runner is not honouring the pin, and a green result here would be a green result on a toolchain nothing in this repository names."
            exit 1
          fi
          for probe in fmt clippy; do
            if ! cargo "$probe" --version; then
              echo "::error file=rust-toolchain.toml::'cargo $probe --version' failed, so the '$probe' component listed in rust-toolchain.toml is not usable on this runner"
              exit 1
            fi
          done
      - name: cargo test --workspace --locked
        run: cargo test --workspace --locked

  gate-1-proof:
    # spec/CI_CD.md section 1, gate 1, INSTALLED. This job carries the
    # demonstration, and it is one of the two jobs in this file, with
    # `gate-2-proof` below, whose success condition is the opposite of
    # everything around it.
    #
    # AICD §14: "a gate is installed only when it has been seen to fail". The
    # `fmt` and `clippy` jobs above have carried gate 1's two commands since
    # ORI-T-0012 without either of them ever being seen to fail, which under
    # that rule is not installation. This job presents gate 1 with defects
    # planted for it, under `fixtures/planted/gate-1/`, and fails the run if the
    # gate does not catch them, if a failure turns out to be some failure other
    # than the planted one, or if this file stops running those commands
    # somewhere their failure would fail the run. What it cannot do is observe
    # itself running. The runs that did, and what a human saw on the pull
    # request, are recorded in ops/gates/gate-1.md.
    #
    # WHAT IT CHECKS ABOUT THIS JOB. The same six structural conditions it
    # applies to `fmt` and `clippy`, applied here: no `if:` and no
    # `continue-on-error:` on this job or on the step below, this job in `ci`'s
    # `needs:`, an unfiltered `pull_request` trigger, and no
    # `continue-on-error:` on `ci`. It applied none of them to this job until
    # ORI-T-0013 attempt 3, and `continue-on-error: true` on this job is one
    # line that turns every refusal the harness can issue into a green check.
    # The harness finds this job in this file by the command below and by the
    # name `gate-1-proof`, and refuses if the two stop agreeing, so renaming
    # this job without renaming it in the harness is a refusal and not a
    # silence. Where that recursion stops is stated in the harness's verdict
    # and in its header: a `continue-on-error:` added here still leaves the run
    # green, because that is what the key means, and the last link is a human
    # reading the diff of this tier 2 file.
    #
    # WHY IT IS A JOB AND NOT ONLY A FILE IN ops/gates/. A proof file records
    # that somebody once saw the gate fail. It stays on disk, unchanged and
    # reassuring, on the day the gate is weakened. This job re-presents the same
    # defects on every pull request, so "gate 1 catches this" is a statement
    # about the commit under review and not about a commit from months ago. The
    # proof file is still written, because AICD §14 asks for the demonstration
    # to be recorded in the ticket, and because a human needs somewhere to read
    # what was done without opening a workflow run.
    #
    # WHY THE PLANTED DEFECTS DO NOT TURN THIS REPOSITORY RED. Each planted
    # package under `fixtures/planted/gate-1/` carries an empty `[workspace]`
    # table, which makes it its own workspace root. The root `Cargo.toml` lists
    # its members explicitly and uses no globs, so `cargo build --workspace`,
    # `cargo fmt --all` and `cargo clippy --workspace` at the repository root
    # never see them. The `fmt` and `clippy` jobs above are themselves the
    # continuous check on that claim: if a planted package ever became visible
    # to the root workspace, those two jobs would go red, and `ci` waits on
    # both of them.
    #
    # WHY ONE RUNNER AND NOT THE CLIPPY MATRIX. What this job detects is gate 1
    # being weakened: an edit to the command in this file, or to the planted
    # input. Both are edits to shared files and neither is platform dependent,
    # so three runners would cost three times as much to detect the same edit.
    # The part that IS platform dependent, a lint that only fires on the code a
    # `cfg(target_os)` branch compiles, is not planted here at all, and
    # `ops/gates/gate-1.md` records that as an open gap rather than letting a
    # three-runner matrix imply coverage this fixture does not have.
    name: gate-1-proof
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Assert the pinned toolchain is the one in use
        run: |
          set -euo pipefail
          pin="$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml)"
          pin="${pin%%$'\n'*}"
          if [ -z "$pin" ]; then
            echo "::error file=rust-toolchain.toml::no [toolchain] channel line found, so the pin cannot be checked at all"
            exit 1
          fi
          if [[ ! "$pin" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=rust-toolchain.toml::the pin is '$pin', which is not an exact x.y.z version. rust-toolchain.toml states why the pin is exact: under a channel pin an upstream release changes the clippy lint set, and the verdict of gate 1 changes with no commit in this repository. Restore the exact pin, or change this check deliberately in a ticket."
            exit 1
          fi
          banner="$(rustc --version)"
          active="$(awk '{print $2}' <<<"$banner")"
          echo "rust-toolchain.toml pins : $pin"
          echo "rustc on PATH reports    : $active   ($banner)"
          if [ "$pin" != "$active" ]; then
            echo "::error file=rust-toolchain.toml::rustc is $active but rust-toolchain.toml pins $pin. This runner is not honouring the pin, and a green result here would be a green result on a toolchain nothing in this repository names."
            exit 1
          fi
          for probe in fmt clippy; do
            if ! cargo "$probe" --version; then
              echo "::error file=rust-toolchain.toml::'cargo $probe --version' failed, so the '$probe' component listed in rust-toolchain.toml is not usable on this runner"
              exit 1
            fi
          done
      - name: Gate 1 must fail on every planted defect and pass on the clean input
        # The harness exits 0 only from its final verdict. It exits 1 when gate
        # 1 stopped catching a defect that is still planted; 2 when it could not
        # prove what it claims, which covers a comparator that cannot tell
        # agreement from disagreement, a gate command this file no longer runs
        # where a failure would fail this run, a `gate-1-proof` job that is
        # itself not one whose failure fails this run or that the harness can
        # no longer find in this file, and a planted input that failed for a
        # reason other than the defect planted in it; and 3 when the
        # toolchain made the gate unrunnable so nothing was checked. It writes
        # `::error::` annotations, so the reason lands on the pull request check
        # rather than only in a log somebody has to open:
        # spec/runbooks/prove-gate.md step 3, "visible where a human would
        # look".
        run: bash fixtures/planted/gate-1/prove.sh

  gate-2-proof:
    # spec/CI_CD.md section 1, gate 2, PROVEN and not yet installed. This job
    # carries the demonstration, and it is the second job in this file whose
    # success condition is the opposite of everything around it.
    #
    # AICD §14: "a gate is installed only when it has been seen to fail". The
    # `test` job above has carried `cargo test --workspace --locked` since
    # ORI-T-0012 without ever being seen to fail, which under that rule is not
    # installation. This job presents gate 2 with inputs planted for it, under
    # `fixtures/planted/gate-2/`, and fails the run if the gate does not answer
    # each of them the way `ops/gates/gate-2.md` records, if an answer turns
    # out to be the answer to some other question, if a planted input has
    # stopped being planted, or if this file stops running the gate command
    # somewhere its failure would fail this run.
    #
    # WHAT MAKES GATE 2 DIFFERENT FROM GATE 1, AND IT IS THE REASON THIS JOB
    # READS THE WAY IT DOES. Gate 1 checks a property of the code. Gate 2
    # checks a property of the TESTS, and a test suite can be green and prove
    # nothing. That is not a worry about the gate; it is a property of the tool
    # the gate is built on. `cargo test` exits 0 on a package with no tests at
    # all, printing "running 0 tests" and "test result: ok". It exits 0 on
    # tests that assert nothing. It exits 0 when every test carries
    # `#[ignore]`. And `--workspace` is exactly as wide as the root manifest's
    # hand-written `members` list, which in this repository names seventeen
    # crates and uses no globs, so a crate added under `crates/` and left out
    # of that list is a crate whose failing tests never run.
    #
    # So the fixture plants both directions. Three inputs carry a test that
    # fails, at the unit, integration and documentation levels, and gate 2 must
    # catch all three: that is the AICD §14 demonstration. Four more are the
    # states above, and for those the harness's expectation is that gate 2
    # PASSES them. It records the answer rather than repairing it, and it adds
    # no check of its own to make gate 2 look stronger than it is. What a green
    # `test` job establishes, and what it does not, is printed in this job's
    # verdict on every run and written out in `ops/gates/gate-2.md`. The short
    # form: it establishes that the tests which exist, are not ignored and
    # assert something did not fail. Gates 4 and 6 of spec/CI_CD.md section 1,
    # the coverage matrix and the mutation score threshold, are what would make
    # it establish more. Neither exists yet.
    #
    # WHAT IT CHECKS ABOUT THIS JOB. The same six structural conditions it
    # applies to `test`, applied here: no `if:` and no `continue-on-error:` on
    # this job or on the step below, this job in `ci`'s `needs:`, an unfiltered
    # `pull_request` trigger, and no `continue-on-error:` on `ci`. One line of
    # `continue-on-error: true` on this job turns every refusal the harness can
    # issue into a green check, which is the fourth defect ORI-T-0013 found in
    # `gate-1-proof` and the reason that check exists at all. The harness finds
    # this job in this file by the command below and by the name
    # `gate-2-proof`, and refuses if the two stop agreeing. Where the recursion
    # stops is stated in the harness's verdict: a `continue-on-error:` added
    # here still leaves the run green, because that is what the key means, and
    # the last link is a human reading the diff of this tier 2 file.
    #
    # WHY THE PLANTED PACKAGES DO NOT TURN THIS REPOSITORY RED. Each package
    # under `fixtures/planted/gate-2/` carries an empty `[workspace]` table, or
    # is its own workspace, so it is a workspace root of its own. The root
    # `Cargo.toml` lists its members explicitly and uses no globs, so
    # `cargo build --workspace`, `cargo test --workspace`, `cargo fmt --all`
    # and `cargo clippy --workspace` at the repository root never see them. The
    # `test` job above is itself the continuous check on that claim: if a
    # planted package with a failing test ever became visible to the root
    # workspace, `test` would go red, and `ci` waits on it.
    #
    # WHY ONE RUNNER AND NOT THE TEST MATRIX. What this job detects is gate 2
    # being weakened: an edit to the command in this file, or to a planted
    # input. Both are edits to shared files and neither is platform dependent,
    # so three runners would cost three times as much to detect the same edit.
    # The part that IS platform dependent, a test that passes on one operating
    # system and fails on another, is what the three-runner `test` matrix above
    # is for, and it is not planted here.
    name: gate-2-proof
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Assert the pinned toolchain is the one in use
        run: |
          set -euo pipefail
          pin="$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml)"
          pin="${pin%%$'\n'*}"
          if [ -z "$pin" ]; then
            echo "::error file=rust-toolchain.toml::no [toolchain] channel line found, so the pin cannot be checked at all"
            exit 1
          fi
          if [[ ! "$pin" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=rust-toolchain.toml::the pin is '$pin', which is not an exact x.y.z version. rust-toolchain.toml states why the pin is exact: under a channel pin an upstream release changes the clippy lint set, and the verdict of gate 1 changes with no commit in this repository. Restore the exact pin, or change this check deliberately in a ticket."
            exit 1
          fi
          banner="$(rustc --version)"
          active="$(awk '{print $2}' <<<"$banner")"
          echo "rust-toolchain.toml pins : $pin"
          echo "rustc on PATH reports    : $active   ($banner)"
          if [ "$pin" != "$active" ]; then
            echo "::error file=rust-toolchain.toml::rustc is $active but rust-toolchain.toml pins $pin. This runner is not honouring the pin, and a green result here would be a green result on a toolchain nothing in this repository names."
            exit 1
          fi
          for probe in fmt clippy; do
            if ! cargo "$probe" --version; then
              echo "::error file=rust-toolchain.toml::'cargo $probe --version' failed, so the '$probe' component listed in rust-toolchain.toml is not usable on this runner"
              exit 1
            fi
          done
      - name: Gate 2 must fail on every planted failing test, and its silences must be the recorded ones
        # The harness exits 0 only from its final verdict. It exits 1 when gate
        # 2 stopped answering an input the way `ops/gates/gate-2.md` records,
        # which covers both directions: a planted failing test that no longer
        # fails the gate, and a planted silence that has become a failure and
        # so makes the proof file's account of what gate 2 does not establish
        # out of date. It exits 2 when it could not prove what it claims, which
        # covers a comparator that cannot tell agreement from disagreement, a
        # gate command this file no longer runs where a failure would fail this
        # run, a `gate-2-proof` job that is itself not one whose failure fails
        # this run or that the harness can no longer find in this file, a
        # planted input that no longer contains what it was planted to contain,
        # and an answer given for a reason other than the planted one. It exits
        # 3 when the toolchain made the gate unrunnable so nothing was checked.
        # It writes `::error::` annotations, so the reason lands on the pull
        # request check rather than only in a log somebody has to open:
        # spec/runbooks/prove-gate.md step 3, "visible where a human would
        # look".
        run: bash fixtures/planted/gate-2/prove.sh

  ci:
    # THE ONE REQUIRED CHECK. Branch protection and the merge queue should
    # require `ci` and nothing else: the matrix job names above carry the
    # runner label in them and would have to be re-entered by hand in the
    # repository settings every time the matrix changes, which is a list that
    # drifts silently.
    #
    # WHAT THIS JOB IS FOR. It exists to make three states that look like
    # success report as failure:
    #
    #   1. A job was skipped or cancelled. GitHub reports a skipped required
    #      check as neutral, and an aggregate job written with the default `if`
    #      is itself skipped when a dependency fails, which a branch protection
    #      rule can be configured to treat as passing. `if: always()` plus an
    #      explicit result comparison removes that path.
    #   2. A gate job was added to this file and left out of `needs:` below. It
    #      would run, it would fail, and it would block nothing. The job list is
    #      read out of this file rather than kept in a hand-written list here,
    #      and every line where a job could be defined is either classified as a
    #      job or fails this check, so a job cannot be added in a spelling this
    #      check does not see.
    #   3. Nothing ran at all. An empty `needs` payload, or a job list this
    #      check failed to parse, exits non-zero rather than comparing two empty
    #      sets and calling it agreement.
    #
    # AICD §39 and spec/PRD.md Z-02 name all three as one defect class:
    # "present but reporting nothing".
    name: ci
    needs: [build, fmt, clippy, test, gate-1-proof, gate-2-proof]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Every job in this file must be gated, must have run, and must have succeeded
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          WORKFLOW_FILE: .github/workflows/ci.yml
          SELF: ci
        run: |
          set -euo pipefail

          echo "event that fired this run: ${GITHUB_EVENT_NAME}"
          echo "ref: ${GITHUB_REF}"
          echo

          # jq ships on the GitHub-hosted ubuntu image, which is somebody else's
          # image and therefore somebody else's promise. Without this line a
          # missing jq would still fail, but through a command substitution that
          # yields an empty string, and the run would blame the needs payload for
          # a state the payload had nothing to do with. Name the real cause.
          if ! command -v jq >/dev/null 2>&1; then
            echo "::error::jq is not on this runner, so this check cannot read the needs payload and cannot report on any job"
            exit 1
          fi

          # --- 1. the jobs this file defines ---------------------------------
          #
          # Parsed from the file, not from a list maintained here by hand. The
          # parse relies on one property of this file: `jobs:` is the last
          # top-level key, and every job name is alone on its line at exactly
          # two spaces of indentation. Keep it that way. The assertions below
          # fail loudly if the parse ever stops matching, instead of comparing
          # empty sets and passing.
          #
          # EVERY line at that indentation is classified, and one that cannot be
          # is a failure. That is not pedantry. The first version of this parse
          # was a single `sed` substitution, and `  audit: # gate 7` and
          # `  "audit":` are both valid YAML that defines a job and both slipped
          # past it: the new job vanished from the parsed set, the parsed set
          # and the `needs:` set agreed, and this check reported that every job
          # in the file was gated while the new one gated nothing. That is the
          # "present but reporting nothing" class (AICD §39) inside the check
          # that exists to catch it. ORI-T-0013 found it and closed it here.
          jobs_seen="$(awk '
              /^jobs:[ \t]*$/ { injobs = 1; next }
              injobs != 1 { next }
              /^[ \t]*$/ { next }
              /^  [^ ]/ {
                  line = $0
                  sub(/[ \t]*#.*$/, "", line)
                  if (line ~ /^[ \t]*$/) { next }
                  if (line ~ /^  [A-Za-z0-9_-]+:[ \t]*$/) {
                      sub(/^  /, "", line)
                      sub(/:[ \t]*$/, "", line)
                      print "job " line
                      next
                  }
                  print "unreadable " $0
              }
          ' "$WORKFLOW_FILE")"
          unreadable="$(grep '^unreadable ' <<<"$jobs_seen" || true)"
          if [ -n "$unreadable" ]; then
            echo "::error file=$WORKFLOW_FILE::this check cannot classify every line under 'jobs:' where a job could be defined, so it cannot say which jobs this file defines and will not report on a file it only partly read: $unreadable"
            exit 1
          fi
          defined="$(sed -n 's/^job //p' <<<"$jobs_seen" | sort -u)"
          if [ -z "$defined" ]; then
            echo "::error file=$WORKFLOW_FILE::no job names were parsed out of this file, so this check cannot report on the jobs it is supposed to cover"
            exit 1
          fi
          if ! grep -qx -- "$SELF" <<<"$defined"; then
            echo "::error file=$WORKFLOW_FILE::the job list parsed from this file does not contain '$SELF', so the parse is wrong and every comparison below would be meaningless"
            exit 1
          fi

          want="$(grep -vx -- "$SELF" <<<"$defined" || true)"
          if [ -z "$want" ]; then
            echo "::error file=$WORKFLOW_FILE::this file defines no job other than '$SELF'. A pipeline whose only job is the check that the other jobs passed is a pipeline that checks nothing."
            exit 1
          fi

          # --- 2. the jobs this check actually waited on ----------------------
          if [ "$(jq -r 'type' <<<"$NEEDS_JSON")" != "object" ]; then
            echo "::error::the needs payload is not an object; this check cannot report on jobs it cannot see"
            exit 1
          fi
          have="$(jq -r 'keys[]' <<<"$NEEDS_JSON" | sort -u)"

          flatten() { tr '\n' ' ' <<<"${1:-}" | sed 's/  */ /g; s/^ //; s/ *$//'; }
          want_flat="$(flatten "$want")"
          have_flat="$(flatten "$have")"
          echo "jobs defined in this file (excluding '$SELF') : $want_flat"
          echo "jobs this check waits on via needs:          : $have_flat"
          echo

          if [ "$want_flat" != "$have_flat" ]; then
            echo "::error file=$WORKFLOW_FILE::coverage drift. This file defines [$want_flat] but '$SELF' waits on [$have_flat]. Every job here except '$SELF' must be listed in '$SELF''s needs:, or it runs without blocking anything. Add the missing name to needs:."
            exit 1
          fi

          # --- 3. every one of them succeeded --------------------------------
          #
          # 'skipped' and 'cancelled' are failures here. A job that did not run
          # checked nothing, and a check that reports success for a job that did
          # not run is the defect this whole file is arranged around.
          jq -r 'to_entries[] | "  \(.key) = \(.value.result)"' <<<"$NEEDS_JSON"
          bad="$(jq -r '[to_entries[] | select(.value.result != "success") | "\(.key)=\(.value.result)"] | join(" ")' <<<"$NEEDS_JSON")"
          if [ -n "$bad" ]; then
            echo "::error::not every job succeeded: $bad"
            exit 1
          fi

          echo
          echo "every job defined in $WORKFLOW_FILE is gated by '$SELF', ran, and succeeded (fired by ${GITHUB_EVENT_NAME})"
